<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Letras y tiempos · Samay Karaoke</title>
  <link rel="stylesheet" href="timing-editor.css?v=20261019-1">
  <script defer src="assets/vendor/lucide.min.js"></script>
  <script type="module" src="timing-editor.js?v=20261019-1"></script>
</head>
<body>
  <header><a href="./" aria-label="Volver al selector"><i data-lucide="arrow-left"></i></a><h1>Letras y tiempos</h1><span>Samay · BCP</span></header>
  <main>
    <section class="source">
      <label for="song">Canción</label><select id="song"></select>
      <audio id="audio" controls preload="metadata"></audio>
      <div class="transport"><output id="time">00:00.000</output><label>Velocidad <select id="rate"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option></select></label></div>
      <nav class="tools" aria-label="Audio y tiempos">
        <button id="back" title="Retroceder 2 segundos" aria-label="Retroceder 2 segundos"><i data-lucide="rewind"></i></button>
        <button id="play" title="Reproducir o pausar" aria-label="Reproducir o pausar"><i data-lucide="play"></i></button>
        <button id="mark" class="primary">Marcar frase</button>
        <button id="forward" title="Adelantar 2 segundos" aria-label="Adelantar 2 segundos"><i data-lucide="fast-forward"></i></button>
        <button id="undo" title="Deshacer marca" aria-label="Deshacer marca"><i data-lucide="undo-2"></i></button>
      </nav>
      <div class="preview" aria-live="polite"><small id="idx"></small><div id="current">Sin letra</div><div id="next"></div></div>
      <nav class="tools" aria-label="Ajustar marca">
        <button id="nudgeBack" title="Restar 0.1 segundos">−0.1 s</button>
        <button id="nudgeFwd" title="Sumar 0.1 segundos">+0.1 s</button>
        <button id="export" class="primary"><i data-lucide="download"></i>JSON</button>
      </nav>
      <p id="status" role="status"></p>
    </section>
    <section class="textSource">
      <div class="sectionHead"><h2>Letra</h2><label class="upload" for="textFile"><i data-lucide="file-up"></i>TXT<input id="textFile" type="file" accept=".txt,text/plain"></label><button id="exportText" title="Descargar letra TXT" aria-label="Descargar letra TXT"><i data-lucide="download"></i></button></div>
      <textarea id="text" aria-label="Letra, una frase por línea" spellcheck="false"></textarea>
      <button id="apply">Aplicar letra</button>
      <ol id="list" aria-label="Frases y tiempos"></ol>
    </section>
  </main>
</body>
</html>
