<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b19">
  <title>Hallowow Criollazo | Karaoke</title>
  <link rel="stylesheet" href="./karaoke.css?v=20261006-4">
  <script src="./assets/vendor/lucide.min.js" defer></script>
  <script type="module" src="./player-entry.js?v=20261006-3"></script>
</head>
<body class="player-page">
  <div class="stage idle paused" id="stage">
    <img class="cornerWeb webLeft" src="assets/decor/telarana-esquina.png" alt="">
    <img class="cornerWeb webRight" src="assets/decor/telarana-esquina.png" alt="">
    <header class="top">
      <a class="iconBtn" id="backBtn" aria-label="Volver al selector de canciones" title="Volver"><i data-lucide="chevron-left"></i></a>
      <button class="roomPill" id="playerFullscreenBtn" title="Pantalla completa" aria-label="Pantalla completa"><span class="dot" id="playerDot"></span><span class="roomText"><span>SALA</span><b id="roomCode">HALLOWOW</b></span><i data-lucide="chevron-down"></i></button>
      <span class="sr" id="syncState" role="status">Conectando</span>
    </header>
    <section class="brandMasthead playerBrand" aria-label="Hallowow Criollazo, Samay BCP">
      <img class="brandWordmark" src="assets/decor/hallowow-wordmark.webp" alt="Hallowow Criollazo" fetchpriority="high">
      <span class="brandSamay"><img src="../Logo%20Samay.png" alt="Samay BCP"></span>
    </section>
    <main class="playerWrap">
      <section class="lyricPanel" aria-label="Letra de la canción">
        <p class="kicker sr" id="kicker">Pantalla de karaoke</p>
        <div class="lyrics" id="lyrics" aria-live="off">
          <p class="lyricContext previous" id="prev"></p>
          <p class="current" id="current"><span class="currentBase" id="currentBase">Vamos a cantar</span><span class="currentFill" id="currentFill" aria-hidden="true">Vamos a cantar</span></p>
          <p class="lyricContext" id="next"></p><p class="lyricContext" id="next2"></p><p class="lyricContext" id="next3"></p>
        </div>
      </section>
      <section class="infoCard" aria-label="Reproducción">
        <div class="meta"><h1 class="title" id="title">Esperando canción</h1><p class="artist" id="artist">Samay BCP</p><span class="version sr" id="version">Sala lista</span></div>
        <div class="playback">
          <label class="sr" for="seek">Posición de la canción</label><input class="seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" disabled>
          <div class="times"><span id="elapsed">00:00</span><span id="remaining">00:00</span></div>
          <div class="controls">
            <button class="controlBtn" id="shuffleBtn" aria-label="Reproducción aleatoria" aria-pressed="false" title="Aleatorio"><i data-lucide="shuffle"></i></button>
            <button class="controlBtn" id="previousBtn" aria-label="Canción anterior" title="Anterior"><i data-lucide="skip-back"></i></button>
            <button class="playBtn" id="playBtn" aria-label="Reproducir" title="Reproducir"><i class="i-pause" data-lucide="pause"></i><i class="i-play" data-lucide="play"></i></button>
            <button class="controlBtn" id="nextBtn" aria-label="Siguiente canción" title="Siguiente"><i data-lucide="skip-forward"></i></button>
            <button class="controlBtn pumpkinFavorite" id="favoriteBtn" aria-label="Marcar favorita" aria-pressed="false" title="Favorita"><img class="favoriteGlyph" src="assets/icons/icon-halloween.png" alt=""></button>
          </div>
          <p class="state" id="playerState" role="status">Selecciona una canción</p>
        </div>
      </section>
    </main>
    <div class="sceneFooter" aria-hidden="true">
      <img class="footerRibbon" src="assets/decor/cinta-curva.webp" alt="">
      <img class="scenePumpkin" src="assets/decor/pumpkin-hat.webp" alt="">
      <img class="sceneGuitar" src="assets/decor/criollo-guitar.webp" alt="">
    </div>
  </div>
  <dialog class="dialog activate" id="activate" aria-labelledby="activateTitle">
    <img src="assets/decor/hallowow-wordmark.webp" alt="Hallowow Criollazo">
    <img class="activationRibbon" src="assets/decor/cinta-curva.webp" alt="">
    <h2 id="activateTitle">Que empiece el criollazo</h2>
    <button class="primaryButton" id="activateBtn"><i data-lucide="volume-2"></i>Activar audio</button><p id="activationState" role="status"></p>
  </dialog>
  <audio id="audio" preload="metadata" src="../cariñitobareto.mp3"></audio>
</body>
</html>
