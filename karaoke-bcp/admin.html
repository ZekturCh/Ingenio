<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samay Karaoke · Admin</title>
<style>
@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}\n@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Bold.woff2") format("woff2");font-style:normal;font-weight:700 900;font-display:swap}
:root{--o:#f26522;--bg:#f56a14;--panel:rgba(104,25,0,.2);--line:rgba(255,255,255,.25);--text:#fff7e9;--muted:#7e3218}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 5%,#ffc24e 0,transparent 30%),linear-gradient(145deg,#ff8c1b,#f16512 52%,#d44308);color:var(--text);font-family:"Flexo",Verdana,system-ui,sans-serif}.wrap{width:min(820px,calc(100% - 24px));margin:auto;padding:24px 0 50px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top img{width:190px;max-width:48vw;filter:drop-shadow(0 10px 20px rgba(93,23,0,.2))}.badge{border:1px solid var(--line);background:rgba(101,24,0,.18);backdrop-filter:blur(8px);border-radius:999px;padding:9px 12px;font-size:11px;font-weight:800}.card{margin-top:18px;border:1px solid var(--line);background:linear-gradient(155deg,rgba(118,27,0,.26),rgba(96,20,0,.14));backdrop-filter:blur(8px);border-radius:22px;padding:20px}.label{font-size:11px;font-weight:1000;letter-spacing:.14em;color:#fff0d5}.song{font-size:36px;font-weight:1000;margin:6px 0 2px}.artist{color:#ffe4cf}.version{display:inline-flex;margin-top:12px;border:1px solid rgba(255,255,255,.28);background:rgba(99,22,0,.2);border-radius:999px;padding:7px 10px;color:#fff0d6;font-size:12px;font-weight:900}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.controls button{border:1px solid rgba(255,255,255,.28);background:rgba(99,22,0,.2);color:#fff;border-radius:13px;padding:14px 10px;font-weight:1000;cursor:pointer}.controls .primary{border:0;background:#fff1d8;color:#8b2b08}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.links a,.links button{border:1px solid rgba(255,255,255,.28);background:rgba(99,22,0,.16);color:#fff2df;border-radius:12px;padding:12px;text-decoration:none;text-align:center;font-weight:900;font-size:12px;cursor:pointer}.status{margin-top:12px;color:#fff0d8;font-size:12px}.online{color:#dcffdc}.local{color:#fff2a8}.hint{margin-top:18px;color:#ffe2ca;line-height:1.5;font-size:12px}@media(max-width:620px){.controls{grid-template-columns:1fr 1fr}.links{grid-template-columns:1fr}.song{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="assets/logo-hallowow.webp" alt="Hallowow"><div class="badge">SALA <b id="room"></b> · <span id="sync">...</span></div></div>
  <section class="card">
    <div class="label">AHORA SELECCIONADO</div>
    <div class="song" id="song">Esperando canción</div>
    <div class="artist" id="artist">—</div>
    <div class="version" id="version">SIN SELECCIÓN</div>
    <div class="controls">
      <button class="primary" data-command="play">▶ PLAY / RESUME</button>
      <button data-command="pause">❚❚ PAUSA</button>
      <button data-command="restart">↻ REINICIAR</button>
      <button data-command="stop">■ DETENER</button>
    </div>
    <div class="status" id="status">Conectando…</div>
  </section>
  <div class="links">
    <a id="openController" target="_blank">ABRIR SELECTOR</a>
    <a id="openPlayer" target="_blank">ABRIR PLAYER TV</a>
    <button id="copyPlayer">COPIAR LINK PLAYER</button>
    <a href="timing-editor.html" target="_blank">EDITOR DE LETRAS</a>
  </div>
  <div class="hint">En la PC conectada a la TV abre el Player y pulsa “Activar audio” una vez. Después este panel o el celular pueden enviar órdenes a la misma sala.</div>
</div>
<script type="module">
import { roomFromUrl, subscribeRoom, sendCommand, getSong, getVersion, controllerUrl, playerUrl } from "./shared.js";
const room=roomFromUrl(),$=s=>document.querySelector(s);
$("#room").textContent=room;
$("#openController").href=controllerUrl(room);
$("#openPlayer").href=playerUrl(room);
let state=null;
function statusMode(mode){$("#sync").textContent=mode==="online"?"EN LÍNEA":"LOCAL";$("#sync").className=mode==="online"?"online":"local";}
subscribeRoom(room,(next)=>{
  state=next;
  const song=getSong(next.songId),version=getVersion(song,next.versionId);
  $("#song").textContent=song?.title||"Esperando canción";
  $("#artist").textContent=song?.artist||"—";
  $("#version").textContent=version?`${version.label.toUpperCase()} · ${version.durationLabel}`:"SIN SELECCIÓN";
  $("#status").textContent=`Última orden: ${String(next.command||"load").toUpperCase()}`;
},statusMode);
document.querySelectorAll("[data-command]").forEach(btn=>btn.onclick=async()=>{
  if(!state){$("#status").textContent="Primero selecciona una canción desde el catálogo.";return;}
  const result=await sendCommand(room,{...state,command:btn.dataset.command});
  statusMode(result.mode);
  $("#status").textContent=`Orden enviada: ${btn.dataset.command.toUpperCase()}`;
});
$("#copyPlayer").onclick=async()=>{
  const url=playerUrl(room);
  try{await navigator.clipboard.writeText(url);$("#status").textContent="Link del Player copiado.";}
  catch{$("#status").textContent=url;}
};
</script>
</body>
</html>
