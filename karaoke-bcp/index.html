<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F67A1A">
<title>Hallowow Karaoke</title>
<style>
@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Bold.woff2") format("woff2");font-style:normal;font-weight:700 900;font-display:swap}
:root{
  --orange:#F36A18;--orange-deep:#D9480C;--amber:#FFB338;
  --red:#D91F26;--red-dark:#A9141B;--cream:#FFF4E0;
  --ink:#3A1A0E;--wine:#7D1718;--night:#1B120E;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100dvh}
body{font-family:"Flexo",Verdana,system-ui,sans-serif;color:var(--ink);background:#0F1420;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* ---------- App shell (columna tipo celular) ---------- */
.app{
  position:relative;isolation:isolate;overflow:hidden;
  width:min(100%,480px);min-height:100dvh;margin:0 auto;padding:14px 14px 96px;
  background:
    radial-gradient(circle at 72% 6%,rgba(255,226,120,.8),transparent 30%),
    radial-gradient(circle at 6% 42%,rgba(255,170,50,.5),transparent 36%),
    linear-gradient(170deg,#FFAE2B 0%,#F67A1A 40%,#E4560E 100%);
}
@media(min-width:520px){
  body{padding:24px 0}
  .app{min-height:calc(100dvh - 48px);border-radius:38px;box-shadow:0 30px 80px rgba(0,0,0,.55)}
}
.app > *{position:relative;z-index:1}

/* ---------- Top bar ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.iconBtn{
  width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;
  background:rgba(38,18,12,.88);color:#fff;box-shadow:0 8px 18px rgba(80,16,0,.3)
}
.roomPill{
  display:flex;align-items:center;gap:10px;min-width:0;max-width:62%;
  padding:9px 12px 9px 14px;border:0;border-radius:14px;background:rgba(27,18,14,.92);color:#fff;
  box-shadow:0 8px 18px rgba(80,16,0,.3);text-align:left
}
.dot{width:20px;height:20px;border-radius:50%;flex:none;background:#8a8a8a;box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.dot.online{background:radial-gradient(circle at 35% 30%,#7CFF6B,#23B21B)}
.dot.local{background:radial-gradient(circle at 35% 30%,#FFE98A,#E5A912)}
.roomText{display:grid;min-width:0;font-weight:900;font-size:13px;line-height:1.15;letter-spacing:.04em}
.roomText b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:none;opacity:.9}
.bat{position:absolute;z-index:0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(70,14,0,.25))}
.bat.b1{width:54px;left:23%;top:16px}
.bat.b2{width:38px;left:7%;top:104px;transform:rotate(-12deg)}
@media(prefers-reduced-motion:no-preference){
  .bat.b1{animation:float 3.8s ease-in-out infinite}
}
@keyframes float{50%{transform:translateY(-8px) rotate(5deg)}}

.menu{
  position:absolute;z-index:20;left:14px;top:76px;min-width:210px;display:none;
  padding:8px;border-radius:18px;background:rgba(27,18,14,.97);box-shadow:0 18px 40px rgba(60,10,0,.4)
}
.menu.open{display:grid;gap:4px}
.menu a{padding:13px 14px;border-radius:12px;color:#fff;text-decoration:none;font-weight:800;font-size:14px}
.menu a:hover,.menu a:focus-visible{background:rgba(255,125,43,.22)}

/* ---------- Hero ---------- */
.hero{position:relative;text-align:center;margin-top:2px;padding-bottom:6px}
.logoHallo{display:block;width:84%;margin:4px auto 0;filter:drop-shadow(0 8px 14px rgba(80,16,0,.28))}
.logoSamay{display:block;width:30%;margin:-2px auto 0}
.tagline{
  position:relative;display:inline-block;margin:4px 0 0;padding-bottom:7px;
  font-family:"Segoe Script","Bradley Hand","Snell Roundhand","Comic Sans MS",cursive;font-style:italic;font-weight:700;
  font-size:clamp(17px,5.2vw,22px);line-height:1.2;color:#4A1708;max-width:78%
}
.tagline:after{content:"";position:absolute;left:8%;right:30%;bottom:0;height:3px;border-radius:3px;background:var(--red);transform:rotate(-1.5deg)}
.heroArt{display:block;width:92%;max-height:230px;object-fit:contain;margin:6px auto -8px;filter:drop-shadow(0 14px 18px rgba(90,18,0,.3))}
.flower{position:absolute;color:#E3262E;z-index:0}
.flower.f1{width:46px;left:-4px;top:150px;color:#fff3df}
.flower.f2{width:36px;right:-2px;top:70px}
.flower.f3{width:30px;right:6%;bottom:40px;color:#fff3df}
.leaf{position:absolute;width:26px;z-index:0}
.leaf.l1{left:12px;top:120px;transform:rotate(-40deg)}
.leaf.l2{right:8px;top:118px;transform:rotate(35deg)}

/* ---------- Search ---------- */
.search{
  position:relative;z-index:3;display:flex;align-items:center;gap:8px;margin-top:-16px;
  padding:6px 6px 6px 16px;border-radius:22px;background:#FFF9F0;border:2px solid rgba(255,255,255,.75);
  box-shadow:0 12px 26px rgba(100,22,0,.28)
}
.search svg{flex:none;color:#2B1209}
.search input{flex:1;min-width:0;min-height:46px;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink)}
.search input::placeholder{color:#8D6A5B}
.search:focus-within{box-shadow:0 0 0 3px #fff,0 12px 26px rgba(100,22,0,.28)}
.search button{
  min-height:46px;padding:0 22px;border:0;border-radius:16px;color:#fff;font-weight:900;letter-spacing:.03em;
  background:linear-gradient(145deg,#FF8A33,#EE4F0A);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)
}

/* ---------- Filters ---------- */
.filters{display:flex;gap:7px;margin:14px -14px 4px;padding:6px 14px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{
  flex:1 0 66px;min-height:76px;padding:8px 4px;border-radius:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(255,164,72,.4);background:linear-gradient(180deg,#2B1711,#150C09);
  color:#FFE9D6;font-size:10px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;
  box-shadow:0 8px 16px rgba(80,16,0,.25)
}
.filter .ico{font-size:25px;line-height:1;filter:grayscale(.15)}
.filter.active{
  background:linear-gradient(150deg,#FF9440,#F1530B);border-color:#fff;color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.35),0 10px 20px rgba(110,26,0,.35)
}

/* ---------- Songs ---------- */
.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 2px 10px}
.sectionHead h2{margin:0;color:#fff;font-size:15px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 6px rgba(90,16,0,.35)}
.seeAll{border:0;background:none;color:#fff;font-weight:900;font-size:13px;padding:6px 2px;text-transform:uppercase;text-shadow:0 2px 6px rgba(90,16,0,.35)}
.songs{display:grid;gap:9px}
.song{
  position:relative;overflow:hidden;display:grid;grid-template-columns:40px minmax(0,1fr) auto;align-items:center;gap:12px;
  min-height:70px;padding:10px 74px 10px 14px;border-radius:14px;text-align:left;
  background:linear-gradient(180deg,#FFF9EC,#FFEDD2);border:1px solid rgba(255,255,255,.85);
  color:var(--ink);box-shadow:0 8px 18px rgba(100,22,0,.24);transition:transform .15s
}
.song:after{
  content:"";position:absolute;top:0;right:0;bottom:0;width:66px;pointer-events:none;
  background:linear-gradient(115deg,transparent 0 24%,var(--red) 24% 52%,#fff 52% 60%,var(--red) 60%);
}
.song.enabled:active{transform:scale(.985)}
.song.disabled{opacity:.62;filter:saturate(.7);cursor:not-allowed}
.songNote{font-size:34px;line-height:1;text-align:center;color:#F36A18;text-shadow:0 2px 0 rgba(150,50,0,.18)}
.songCopy{min-width:0}
.songCopy b{display:block;font-size:19px;font-weight:900;line-height:1.1;color:#2B1209;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artist{display:block;margin-top:3px;font-size:14px;color:#5E3A2D;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav,.lock{position:relative;z-index:2;width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:#2B1209;border-radius:50%}
.lock{font-size:18px;opacity:.7}
.fav svg{width:28px;height:28px}
.fav svg path{fill:transparent;stroke:currentColor;stroke-width:1.8}
.fav.on{color:var(--red)}
.fav.on svg path{fill:var(--red)}
.empty{padding:26px;border:2px dashed rgba(255,255,255,.7);border-radius:18px;color:#fff;text-align:center;font-weight:700}

.footRibbon{
  position:absolute !important;z-index:0 !important;left:-12%;right:-12%;bottom:-34px;height:96px;transform:rotate(-3.5deg);
  background:linear-gradient(180deg,var(--red) 0 33%,#fff 33% 66%,var(--red) 66%);
  box-shadow:0 -8px 22px rgba(90,16,0,.25);pointer-events:none
}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(60,12,0,.7);backdrop-filter:blur(12px)}
.modal.open{display:grid}
.dialog{
  position:relative;overflow:hidden;width:min(440px,100%);border-radius:28px;padding:22px;
  background:linear-gradient(150deg,#FFB02A,#F36A18 58%,#D9460B);border:2px solid rgba(255,255,255,.7);box-shadow:0 35px 90px rgba(60,12,0,.45)
}
.dialog:before{content:"";position:absolute;right:-50px;top:-36px;width:160px;height:160px;background:url("assets/murcielago.webp") center/contain no-repeat;opacity:.2}
.dialogTop{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px}
.dialogLabel{font-size:12px;font-weight:900;letter-spacing:.08em;color:#fff3df;text-transform:uppercase}
.dialog h2{margin:4px 0 2px;color:#fff;font-size:34px;line-height:1;text-shadow:0 3px 0 rgba(150,40,0,.3)}
.dialogArtist{color:#fff3df;font-weight:700}
.close{width:42px;height:42px;border:1px solid rgba(255,255,255,.5);background:rgba(90,18,0,.25);border-radius:50%;color:#fff;font-size:22px}
.versions{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.version{
  position:relative;min-height:142px;padding:16px;border:1px solid rgba(255,148,72,.45);border-radius:20px;text-align:left;
  background:linear-gradient(180deg,#FFF9EC,#FFEBCE);color:var(--ink);box-shadow:0 12px 24px rgba(75,16,0,.25)
}
.version strong{display:block;font-size:19px;font-weight:900}
.version .duration{font-size:38px;font-weight:900;color:var(--orange);margin:4px 0}
.version small{color:#7a4a3a}
.version.recommended:before{content:"Recomendada";display:inline-flex;margin-bottom:8px;background:var(--red);color:#fff;border-radius:999px;padding:4px 9px;font-size:10px;font-weight:900}
.modalNote{position:relative;z-index:2;margin-top:14px;color:#fff0dc;font-size:12px;line-height:1.45}

.toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,30px);opacity:0;pointer-events:none;max-width:90vw;padding:11px 16px;border-radius:999px;background:#fff;color:var(--wine);font-weight:900;box-shadow:0 12px 30px rgba(89,18,0,.25);transition:.22s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:380px){
  .versions{grid-template-columns:1fr}.version{min-height:120px}
  .songCopy b{font-size:17px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="0 0 100 100">
      <g fill="currentColor">
        <circle cx="50" cy="22" r="20"/>
        <circle cx="50" cy="22" r="20" transform="rotate(72 50 50)"/>
        <circle cx="50" cy="22" r="20" transform="rotate(144 50 50)"/>
        <circle cx="50" cy="22" r="20" transform="rotate(216 50 50)"/>
        <circle cx="50" cy="22" r="20" transform="rotate(288 50 50)"/>
      </g>
      <circle cx="50" cy="50" r="13" fill="#FFC53D"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 60 100"><path d="M30 0C62 30 62 70 30 100 -2 70 -2 30 30 0Z" fill="#2E7D32"/></symbol>
  </defs>
</svg>

<div class="app">
  <img class="bat b1" src="assets/murcielago.webp" alt="">
  <img class="bat b2" src="assets/murcielago.webp" alt="">

  <header class="top">
    <button class="iconBtn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="roomPill" id="roomPill" aria-label="Sala">
      <i class="dot" id="dot"></i>
      <span class="roomText"><span>SALA</span><b id="room"></b></span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </header>

  <nav class="menu" id="menu" aria-label="Menú">
    <a id="playerLink" target="_blank" rel="noopener">Abrir pantalla TV</a>
    <a id="adminLink" target="_blank" rel="noopener">Administrar sala</a>
  </nav>

  <section class="hero" aria-label="Hallowow Criollazo">
    <svg class="flower f1" viewBox="0 0 100 100"><use href="#flower"/></svg>
    <svg class="flower f2" viewBox="0 0 100 100"><use href="#flower"/></svg>
    <svg class="leaf l1" viewBox="0 0 60 100"><use href="#leaf"/></svg>
    <svg class="leaf l2" viewBox="0 0 60 100"><use href="#leaf"/></svg>
    <img class="logoHallo" src="assets/logo-hallowow.webp" alt="Hallowow Criollazo" fetchpriority="high">
    <img class="logoSamay" src="assets/logo-samay.png" alt="Samay BCP">
    <p class="tagline">Entre tradición, música y buenas historias</p>
    <img class="heroArt" src="assets/calabaza-guitarra.webp" alt="">
  </section>

  <div class="search" role="search">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" placeholder="Busca tu canción, artista o género…" autocomplete="off" aria-label="Buscar canción, artista o género">
    <button id="find">Buscar</button>
  </div>

  <nav class="filters" id="filters" aria-label="Categorías">
    <button class="filter active" data-filter="all"><span class="ico">♫</span>Todas</button>
    <button class="filter" data-filter="criollo"><span class="ico">🎸</span>Criollo</button>
    <button class="filter" data-filter="peru"><span class="ico">⛰️</span>Perú</button>
    <button class="filter" data-filter="fiesta"><span class="ico">✦</span>Fiesta</button>
    <button class="filter" data-filter="clasicos"><span class="ico">★</span>Clásicos</button>
    <button class="filter" data-filter="halloween"><span class="ico">🎃</span>Halloween</button>
  </nav>

  <div class="sectionHead">
    <h2>Canciones destacadas</h2>
    <button class="seeAll" id="seeAll">Ver todas ›</button>
  </div>
  <section class="songs" id="songs"></section>

  <div class="footRibbon" aria-hidden="true"></div>
</div>

<div class="modal" id="modal">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dialogTop">
      <div>
        <div class="dialogLabel">Elige tu versión</div>
        <h2 id="dlgTitle">Cariñito</h2>
        <div class="dialogArtist" id="dlgArtist">Bareto</div>
      </div>
      <button class="close" id="close" aria-label="Cerrar">×</button>
    </div>
    <div class="versions" id="versions"></div>
    <div class="modalNote">La versión corta usa un fragmento del mismo instrumental. La canción completa dura 3:44.</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { SONGS, roomFromUrl, sendCommand, subscribeRoom, playerUrl, adminUrl } from "./shared.js";

const room=roomFromUrl(),$=s=>document.querySelector(s);
$("#room").textContent=room;
$("#playerLink").href=playerUrl(room);
$("#adminLink").href=adminUrl(room);

const categories={
  "carinito":["fiesta","peru"],
  "odiame":["criollo","peru","clasicos"],
  "himno-peru":["peru","clasicos"],
  "cuando-pienses":["peru","fiesta"],
  "ritmo-color-sabor":["criollo","fiesta","peru"]
};
let query="",activeFilter="all";

/* favoritos (solo en este dispositivo) */
const FAV_KEY="samay-karaoke-favs";
function loadFavs(){try{return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||"[]"))}catch{return new Set()}}
function saveFavs(set){try{localStorage.setItem(FAV_KEY,JSON.stringify([...set]))}catch{}}
const favs=loadFavs();

function toast(message){
  const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),1900);
}
function visibleSongs(){
  return SONGS.filter(s=>{
    const matchesText=(s.title+" "+s.artist).toLowerCase().includes(query.toLowerCase());
    const matchesFilter=activeFilter==="all" || (categories[s.id]||[]).includes(activeFilter);
    return matchesText&&matchesFilter;
  });
}
const HEART='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.4 4.8 6.6 4.8c2 0 3.7 1.1 5.4 3.1 1.7-2 3.4-3.1 5.4-3.1 3.2 0 5.1 3.2 3.9 6.5-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>';

function renderSongs(){
  const list=visibleSongs();
  $("#songs").innerHTML=list.length?list.map(s=>`
    <div class="song ${s.enabled?"enabled":"disabled"}" data-id="${s.id}" role="button" tabindex="${s.enabled?0:-1}" ${s.enabled?"":"aria-disabled='true'"}>
      <span class="songNote" aria-hidden="true">♫</span>
      <span class="songCopy"><b>${s.title}</b><span class="artist">${s.artist}${s.enabled?"":" · Próximamente"}</span></span>
      ${s.enabled
        ?`<button class="fav ${favs.has(s.id)?"on":""}" data-fav="${s.id}" aria-label="Favorita" aria-pressed="${favs.has(s.id)}">${HEART}</button>`
        :`<span class="lock" aria-hidden="true">🔒</span>`}
    </div>`).join(""):'<div class="empty">No encontré canciones con ese filtro. Prueba con otra categoría.</div>';

  document.querySelectorAll(".song").forEach(card=>{
    const open=()=>{
      const song=SONGS.find(s=>s.id===card.dataset.id);
      if(!song?.enabled){toast("Esa canción estará disponible próximamente.");return;}
      openVersions(song);
    };
    card.onclick=open;
    card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}};
  });
  document.querySelectorAll(".fav").forEach(btn=>btn.onclick=e=>{
    e.stopPropagation();
    const id=btn.dataset.fav;
    favs.has(id)?favs.delete(id):favs.add(id);
    saveFavs(favs);
    btn.classList.toggle("on",favs.has(id));
    btn.setAttribute("aria-pressed",favs.has(id));
  });
}
function openVersions(song){
  $("#dlgTitle").textContent=song.title;
  $("#dlgArtist").textContent=song.artist;
  $("#versions").innerHTML=song.versions.map(v=>`
    <button class="version ${v.id==="chorus"?"recommended":""}" data-version="${v.id}">
      <strong>${v.label}</strong>
      <div class="duration">${v.durationLabel}</div>
      <small>${v.note}</small>
    </button>`).join("");
  document.querySelectorAll(".version").forEach(btn=>btn.onclick=async()=>{
    const version=song.versions.find(v=>v.id===btn.dataset.version);
    const result=await sendCommand(room,{songId:song.id,versionId:version.id,command:"play",startAt:version.startAt,endAt:version.endAt});
    $("#modal").classList.remove("open");
    toast(result.mode==="online"?`${song.title} · ${version.label} enviada a la TV 🎤`:"Selección guardada en modo local.");
  });
  $("#modal").classList.add("open");
}
function setFilter(value){
  activeFilter=value;
  document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter===value));
  renderSongs();
}
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>setFilter(btn.dataset.filter));
$("#seeAll").onclick=()=>{query="";$("#search").value="";setFilter("all")};
$("#close").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
$("#find").onclick=()=>{query=$("#search").value.trim();renderSongs()};
$("#search").oninput=()=>{query=$("#search").value.trim();renderSongs()};

/* menú */
function toggleMenu(force){
  const open=force??!$("#menu").classList.contains("open");
  $("#menu").classList.toggle("open",open);
  $("#menuBtn").setAttribute("aria-expanded",open);
}
$("#menuBtn").onclick=e=>{e.stopPropagation();toggleMenu()};
$("#roomPill").onclick=e=>{e.stopPropagation();toggleMenu()};
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))toggleMenu(false)});

subscribeRoom(room,()=>{},mode=>{
  const dot=$("#dot");
  dot.className="dot "+(mode==="online"?"online":"local");
  $("#roomPill").title=mode==="online"?"En línea":"Modo local";
});
