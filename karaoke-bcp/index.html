<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b19">
  <title>Hallowow Criollazo | Karaoke Samay BCP</title>
  <link rel="stylesheet" href="./assets/fonts/flexo/flexo.css?v=20261023-1">
  <link rel="stylesheet" href="./karaoke.css?v=20261030-1">
  <script src="./assets/vendor/lucide.min.js" defer></script>
  <script type="module" src="./controller.js?v=20261030-1"></script>
  <link rel="stylesheet" href="./device-menu.css?v=20261030-2">
  <script type="module" src="./device-menu.js?v=20261030-2"></script>
  <meta name="karaoke-build" content="77bbc59ff26d73051d71">
</head>
<body class="controller-page">
  <main class="app controller-shell" id="selectorView">
    <img class="cornerWeb webLeft" src="assets/decor/telarana-esquina.png" alt="">
    <img class="cornerWeb webRight" src="assets/decor/telarana-esquina.png" alt="">
    <header class="top">
      <button class="fullscreenControl" id="fullscreenBtn" aria-label="Pantalla completa" aria-pressed="false" title="Pantalla completa"><i data-lucide="maximize"></i></button>
    </header>
    <section class="brandMasthead" aria-label="Hallowow Criollazo, Samay BCP">
      <img class="brandWordmark" src="assets/decor/hallowow-wordmark.webp" alt="Hallowow Criollazo" fetchpriority="high">
      <span class="brandSamay"><img src="../Logo%20Samay.png" alt="Samay BCP"></span>
    </section>
    <section class="catalog" aria-label="Seleccionar canción">
      <form class="search" id="searchForm" role="search">
        <i data-lucide="search" aria-hidden="true"></i>
        <input id="search" type="search" placeholder="Busca tu canción, artista o género..." autocomplete="off" aria-label="Buscar canción, artista o género">
        <button id="find" type="submit">Buscar</button>
      </form>
      <div class="sectionHead"><h1 id="listTitle">Canciones destacadas</h1><button class="seeAll" id="seeAll">Ver todas <i data-lucide="arrow-right"></i></button></div>
      <div class="playlistArea">
        <section class="songs" id="songs" aria-label="Canciones" tabindex="0"></section>
        <img class="playlistRibbon" src="assets/decor/cinta-curva.webp" alt="">
        <div class="playlistDecor" aria-hidden="true">
          <img class="scenePumpkin" src="assets/decor/pumpkin-hat.webp" alt="">
          <img class="sceneGuitar" src="assets/decor/criollo-guitar.webp" alt="">
        </div>
      </div>
    </section>
  </main>
  <div id="playbackView" hidden></div>
  <dialog class="dialog" id="modal" aria-labelledby="dlgTitle">
    <div class="dialogTop"><div><p class="dialogLabel">Elige tu versión</p><h2 id="dlgTitle"></h2><p class="dialogArtist" id="dlgArtist"></p></div><button class="close iconBtn" id="close" aria-label="Cerrar" title="Cerrar"><i data-lucide="x"></i></button></div>
    <div class="versions" id="versions"></div><p class="modalNote" id="modalNote" role="status"></p>
  </dialog>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
