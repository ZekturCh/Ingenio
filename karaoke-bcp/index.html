<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F36A18">
<title>Hallowow Karaoke</title>
<style>
@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Regular.woff2") format("woff2");font-style:normal;font-weight:400;font-display:swap}
@font-face{font-family:"Flexo";src:url("assets/fonts/Flexo-Bold.woff2") format("woff2");font-style:normal;font-weight:700 900;font-display:swap}
:root{
  --orange:#F36A18;--orange-deep:#DF4C0B;--orange-light:#FFB338;
  --red:#D91F26;--red-dark:#A9141B;--cream:#FFF7E9;--paper:#FFFDF7;
  --ink:#5F1E0B;--wine:#7D1718;--shadow:0 18px 44px rgba(113,27,5,.18)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;min-height:100dvh}
body{
  font-family:"Flexo",Verdana,system-ui,sans-serif;color:var(--ink);overflow-x:hidden;
  background:
    radial-gradient(circle at 75% 8%,rgba(255,220,107,.46),transparent 24%),
    linear-gradient(160deg,#F98A1D 0%,#F36A18 52%,#D9480C 100%);
}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.page{position:relative;isolation:isolate;min-height:100dvh;padding:18px 14px 56px}
.page:before,.page:after{display:none}
.shell{width:min(1080px,100%);margin:0 auto;position:relative}
.shell:before,.shell:after{display:none}
.header{display:flex;justify-content:flex-end;align-items:center;min-height:42px;position:relative;z-index:5}
.headerTools{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.badge,.miniLink{border:1px solid rgba(255,255,255,.44);background:rgba(111,26,0,.18);backdrop-filter:blur(10px);border-radius:999px;padding:8px 11px;color:#fff;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.04em}
.sync.online{color:#e1ffe2}.sync.local{color:#fff0a9}


.heroArtWrap{
  margin-top:10px;position:relative;overflow:hidden;border-radius:28px;
  border:2px solid rgba(255,255,255,.58);box-shadow:0 22px 54px rgba(107,24,4,.20);
  background:#EF6516
}
.heroPicture,.heroPicture img{display:block;width:100%}
.heroPicture img{height:auto;object-fit:contain;object-position:center}
.searchPanel{
  width:min(760px,92%);margin:-26px auto 0;position:relative;z-index:4;
  padding:12px;border-radius:20px;background:rgba(36,18,13,.94);
  border:1px solid rgba(255,145,66,.48);box-shadow:0 18px 34px rgba(93,18,0,.23)
}
.search{display:grid;grid-template-columns:1fr auto;gap:9px;margin:0}
.search input{
  min-width:0;min-height:56px;border:1px solid rgba(255,155,84,.24);border-radius:14px;padding:0 18px;
  background:#FFF9F0;color:var(--ink);outline:none;box-shadow:none
}
.search input::placeholder{color:#9E6550}
.search button{
  min-height:56px;border:0;border-radius:14px;padding:0 24px;
  background:linear-gradient(145deg,#FF852F,#ED4F09);color:#fff;font-weight:900;
  box-shadow:0 8px 18px rgba(189,56,6,.25)
}
.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:22px 2px 12px}
.filter{
  position:relative;min-height:112px;border:1px solid rgba(255,164,72,.48);border-radius:22px;padding:16px 10px 13px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:
    radial-gradient(circle at 50% 18%,rgba(255,111,28,.18),transparent 40%),
    linear-gradient(180deg,#2B1711,#120B09);
  color:#FFE9D6;font-size:12px;font-weight:800;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 12px 28px rgba(94,20,0,.2);
  transition:.18s
}
.filter:before{
  content:attr(data-icon);width:48px;height:48px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(145deg,#FF8D35,#F1530B);color:#fff;font-size:24px;
  box-shadow:0 0 0 1px rgba(255,191,118,.5),0 8px 18px rgba(255,89,10,.2)
}
.filter:hover{transform:translateY(-2px);border-color:#FF9A48}
.filter.active{border-color:#FFB46B;background:radial-gradient(circle at 50% 18%,rgba(255,119,28,.26),transparent 42%),linear-gradient(180deg,#351911,#170C09);color:#fff;box-shadow:0 0 0 2px rgba(255,111,28,.18),0 16px 32px rgba(92,18,0,.22)}
.filter.active:after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,131,55,.22);border-radius:17px;pointer-events:none}

.sectionHead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:16px 3px 12px}
.sectionHead h2{margin:0;color:#fff;font-size:20px;font-weight:900;letter-spacing:.02em}
.sectionHead small{color:#fff0db;font-size:12px}
.flagLine{width:92px;height:6px;margin-bottom:8px;border-radius:99px;background:linear-gradient(90deg,var(--red) 0 33%,#fff 33% 66%,var(--red) 66%)}

.songs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.song{
  position:relative;overflow:hidden;min-height:104px;border:1px solid rgba(255,255,255,.62);border-radius:22px;padding:17px 18px 17px 20px;
  display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px;text-align:left;
  background:
    linear-gradient(90deg,var(--red) 0 9px,transparent 9px calc(100% - 9px),var(--red) calc(100% - 9px)),
    linear-gradient(180deg,#FFFDF8,#FFF7EE);
  color:var(--wine);box-shadow:0 16px 36px rgba(111,25,0,.18);transition:.18s
}
.song:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.55),transparent 36%);pointer-events:none}
.song.enabled{cursor:pointer}
.song.enabled:hover{transform:translateY(-2px);box-shadow:0 22px 42px rgba(113,27,5,.22)}
.song.disabled{opacity:.56;filter:saturate(.75);cursor:not-allowed}
.songIcon{position:relative;z-index:2;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#2A1711,#120B09);color:#FF8B3A;font-size:22px;box-shadow:0 8px 18px rgba(66,12,0,.18),inset 0 0 0 1px rgba(255,129,55,.28)}
.songCopy{position:relative;z-index:2;min-width:0}
.songCopy b{display:block;font-size:16px;font-weight:900;line-height:1.08}
.artist{display:block;margin-top:6px;color:#A44D40;font-size:12px}
.status{position:relative;z-index:2;justify-self:end;border-radius:999px;padding:7px 9px;font-size:9px;font-weight:900;letter-spacing:.05em;white-space:nowrap}
.status.live{background:#FCE5E3;color:var(--red-dark)}
.status.locked{background:#EFE5DE;color:#986B5E}

.footerDecor{display:flex;justify-content:center;gap:22px;margin-top:28px;padding-top:22px;border-top:1px solid rgba(255,255,255,.3);color:#fff6e7;font-size:24px;opacity:.84}

.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(88,18,0,.62);backdrop-filter:blur(14px)}
.modal.open{display:grid}
.dialog{
  position:relative;overflow:hidden;width:min(600px,100%);border-radius:28px;padding:24px;
  background:linear-gradient(150deg,#FF9E24,#EF6413 60%,#D9460B);
  border:2px solid rgba(255,255,255,.58);box-shadow:0 35px 90px rgba(84,18,0,.35)
}
.dialog:before{content:"";position:absolute;right:-65px;top:-50px;width:185px;height:185px;background:url("assets/murcielago.webp") center/contain no-repeat;opacity:.18}
.dialogTop{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px}
.dialogLabel{font-size:10px;font-weight:900;letter-spacing:.14em;color:#fff3df}
.dialog h2{margin:4px 0 2px;color:#fff;font-size:36px;line-height:1}
.dialogArtist{color:#fff3df;font-weight:700}
.close{width:42px;height:42px;min-height:42px;border:1px solid rgba(255,255,255,.42);background:rgba(111,25,0,.2);border-radius:50%;color:#fff;font-size:22px}
.versions{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.version{
  position:relative;overflow:hidden;min-height:152px;border:1px solid rgba(255,148,72,.42);border-radius:22px;padding:18px 20px;text-align:left;
  background:radial-gradient(circle at 78% 12%,rgba(255,105,25,.15),transparent 36%),linear-gradient(180deg,#2B1711,#120B09);
  color:#FFE9D7;box-shadow:0 15px 30px rgba(75,16,0,.22)
}
.version strong{display:block;font-size:20px;font-weight:900;color:#fff}
.version .duration{font-size:38px;font-weight:900;color:#FF7D2B;margin:6px 0}
.version small{color:#CDAE9E}
.version.recommended:before{content:"RECOMENDADA";display:inline-flex;margin-bottom:8px;background:var(--red);color:#fff;border-radius:999px;padding:5px 8px;font-size:8px;font-weight:900;letter-spacing:.1em}
.modalNote{position:relative;z-index:2;margin-top:14px;color:#fff0DC;font-size:11px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:24px;z-index:50;transform:translate(-50%,30px);opacity:0;pointer-events:none;max-width:90vw;padding:11px 16px;border-radius:999px;background:#fff;color:var(--wine);font-weight:900;box-shadow:0 12px 30px rgba(89,18,0,.22);transition:.22s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:760px){
  .page{padding:10px 8px 42px}.header{min-height:38px;justify-content:center}.headerTools{justify-content:center}.miniLink{display:none}
  .heroArtWrap{margin-top:7px;border-radius:22px}
  .searchPanel{width:94%;margin:-18px auto 0;padding:9px;border-radius:17px}
  .search{grid-template-columns:1fr}.search input,.search button{min-height:52px}.search button{width:100%}
  .filters{grid-template-columns:repeat(3,1fr);gap:9px;padding-top:14px}.filter{min-height:92px;padding:12px 7px;font-size:11px}.filter:before{width:40px;height:40px;border-radius:13px;font-size:20px}
  .sectionHead{margin-top:12px}.sectionHead h2{font-size:18px}.sectionHead small{display:none}
  .songs{grid-template-columns:1fr}.song{min-height:86px;grid-template-columns:48px minmax(0,1fr);padding:13px 16px 13px 19px}.songIcon{width:44px;height:44px}.status{grid-column:2;justify-self:start;margin-top:-3px}
  .versions{grid-template-columns:1fr}.version{min-height:130px}.dialog{padding:19px;border-radius:22px}
}
@media(max-width:420px){.filters{grid-template-columns:repeat(2,1fr)}.filter{min-height:88px}.searchPanel{margin-top:-12px}}
@media(orientation:portrait) and (min-width:760px){
  .shell{width:min(92vw,960px)}.heroArtWrap{border-radius:34px}
  .searchPanel{width:min(800px,88%);margin-top:-34px;padding:14px}.search input,.search button{min-height:66px;font-size:18px}.filter{min-height:130px;font-size:16px;padding:16px 12px}.filter:before{width:58px;height:58px;font-size:28px}
  .sectionHead h2{font-size:27px}.sectionHead small{font-size:15px}.songs{grid-template-columns:1fr}.song{min-height:102px}.songCopy b{font-size:22px}.artist{font-size:16px}.status{font-size:12px}
}
@media(orientation:landscape) and (max-height:700px){
  .page{padding-top:6px}.header{min-height:32px}.heroArtWrap{margin-top:4px;border-radius:20px}
  .searchPanel{width:min(700px,78%);margin-top:-22px;padding:8px}.search input,.search button{min-height:48px}
  .filters{padding-top:10px}.sectionHead{margin-top:8px}.song{min-height:74px}.footerDecor{margin-top:16px;padding-top:14px}
}
</style>
</head>
<body>
<div class="page">
  <div class="shell">
    <header class="header">
      <div class="headerTools">
        <div class="badge">SALA <b id="room"></b> · <span class="sync" id="sync">CONECTANDO</span></div>
        <a class="miniLink" id="playerLink" target="_blank">PLAYER TV</a>
        <a class="miniLink" id="adminLink" target="_blank">ADMIN</a>
      </div>
    </header>

    <section class="heroArtWrap" aria-label="Hallowow Criollazo">
      <picture class="heroPicture">
        <source media="(orientation: portrait)" srcset="assets/header-hallowow-vertical.png">
        <img src="assets/header-hallowow-horizontal.png" alt="Hallowow Criollazo · tradición y música" fetchpriority="high">
      </picture>
    </section>

    <div class="searchPanel">
      <div class="search">
        <input id="search" placeholder="Busca tu canción o artista…" autocomplete="off">
        <button id="find">BUSCAR</button>
      </div>
    </div>

    <nav class="filters" id="filters" aria-label="Categorías">
      <button class="filter active" data-filter="all" data-icon="♫">Todas</button>
      <button class="filter" data-filter="criollo" data-icon="🎸">Criollo</button>
      <button class="filter" data-filter="peru" data-icon="🇵🇪">Perú</button>
      <button class="filter" data-filter="fiesta" data-icon="✦">Fiesta</button>
      <button class="filter" data-filter="halloween" data-icon="🎃">Halloween</button>
    </nav>

    <div class="sectionHead">
      <div><div class="flagLine"></div><h2>Canciones destacadas</h2></div>
      <small>1 disponible · 4 próximamente</small>
    </div>
    <section class="songs" id="songs"></section>

    <div class="footerDecor">✿ <span>♪</span> ✦ <span>♫</span> ✿</div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="dialog">
    <div class="dialogTop">
      <div>
        <div class="dialogLabel">ELIGE TU VERSIÓN</div>
        <h2>Cariñito</h2>
        <div class="dialogArtist">Bareto</div>
      </div>
      <button class="close" id="close" aria-label="Cerrar">×</button>
    </div>
    <div class="versions" id="versions"></div>
    <div class="modalNote">La versión corta usa un fragmento del mismo instrumental. La canción completa dura 3:44.</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { SONGS, roomFromUrl, sendCommand, subscribeRoom, playerUrl, adminUrl } from "./shared.js";

const room=roomFromUrl(),$=s=>document.querySelector(s);
$("#room").textContent=room;
$("#playerLink").href=playerUrl(room);
$("#adminLink").href=adminUrl(room);

const categories={
  "carinito":["fiesta","peru"],
  "odiame":["criollo","peru"],
  "himno-peru":["peru"],
  "cuando-pienses":["peru","fiesta"],
  "ritmo-color-sabor":["criollo","fiesta","peru"]
};
let query="",activeFilter="all";

function toast(message){
  const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>el.classList.remove("show"),1900);
}
function visibleSongs(){
  return SONGS.filter(s=>{
    const matchesText=(s.title+" "+s.artist).toLowerCase().includes(query.toLowerCase());
    const matchesFilter=activeFilter==="all" || (categories[s.id]||[]).includes(activeFilter);
    return matchesText&&matchesFilter;
  });
}
function renderSongs(){
  const list=visibleSongs();
  $("#songs").innerHTML=list.length?list.map(s=>`
    <button class="song ${s.enabled?"enabled":"disabled"}" data-id="${s.id}" ${s.enabled?"":"aria-disabled='true'"}>
      <span class="songIcon">♫</span>
      <span class="songCopy"><b>${s.title}</b><span class="artist">${s.artist}</span></span>
      <span class="status ${s.enabled?"live":"locked"}">${s.enabled?"DISPONIBLE":"PRÓXIMAMENTE 🔒"}</span>
    </button>`).join(""):'<div style="grid-column:1/-1;padding:30px;border:1px dashed rgba(255,255,255,.55);border-radius:18px;color:white;text-align:center">No encontré canciones en esta categoría.</div>';

  document.querySelectorAll(".song").forEach(btn=>btn.onclick=()=>{
    const song=SONGS.find(s=>s.id===btn.dataset.id);
    if(!song?.enabled){toast("Esa canción estará disponible próximamente.");return;}
    openVersions(song);
  });
}
function openVersions(song){
  $("#versions").innerHTML=song.versions.map(v=>`
    <button class="version ${v.id==="chorus"?"recommended":""}" data-version="${v.id}">
      <strong>${v.label}</strong>
      <div class="duration">${v.durationLabel}</div>
      <small>${v.note}</small>
    </button>`).join("");
  document.querySelectorAll(".version").forEach(btn=>btn.onclick=async()=>{
    const version=song.versions.find(v=>v.id===btn.dataset.version);
    const result=await sendCommand(room,{songId:song.id,versionId:version.id,command:"play",startAt:version.startAt,endAt:version.endAt});
    $("#modal").classList.remove("open");
    toast(result.mode==="online"?`${song.title} · ${version.label} enviada a la TV 🎤`:"Selección guardada en modo local.");
  });
  $("#modal").classList.add("open");
}
document.querySelectorAll(".filter").forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");activeFilter=btn.dataset.filter;renderSongs();
});
$("#close").onclick=()=>$("#modal").classList.remove("open");
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};
$("#find").onclick=()=>{query=$("#search").value.trim();renderSongs()};
$("#search").oninput=()=>{query=$("#search").value.trim();renderSongs()};
subscribeRoom(room,()=>{},mode=>{
  $("#sync").textContent=mode==="online"?"EN LÍNEA":"LOCAL";
  $("#sync").className="sync "+(mode==="online"?"online":"local");
});
renderSongs();
</script>
</body>
</html>
